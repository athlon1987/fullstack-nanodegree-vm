# Edge request limits for the Malaysia Airports concept site, for an nginx tier in front of
# `next start` (security-06). The same numbers as ROUTE_POLICIES in
# src/lib/concierge/rate-limit.ts, applied before requests reach the app. Not deployed: deploying
# on MAHB infrastructure is OOS-11. Include inside the `http { }` block.
#
# The app then trusts exactly one proxy hop: set TRUSTED_PROXY_HOPS=1 on the app, and keep
# `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;` below, so the right-most entry is
# the address nginx saw. Behind a CDN, use its client-IP header instead (real_ip module, or
# TRUSTED_CLIENT_IP_HEADER on the app).

limit_req_zone $binary_remote_addr zone=ma_concierge:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ma_flights:10m   rate=60r/m;
limit_req_zone $binary_remote_addr zone=ma_health:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=ma_reports:10m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=ma_api:10m       rate=60r/m;
limit_req_zone $binary_remote_addr zone=ma_dynamic:10m   rate=60r/m;
limit_req_status 429;

upstream ma_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 443 ssl;
  http2 on;
  server_name example.invalid; # replace with the production host

  # Nothing the site accepts is larger than 16 KB (the concierge takes 4 KB).
  client_max_body_size 16k;
  client_body_timeout 10s;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  location = /api/concierge {
    limit_req zone=ma_concierge burst=10 nodelay;
    client_max_body_size 4k;
    limit_except POST { deny all; }
    proxy_pass http://ma_app;
  }
  location /api/flights {
    limit_req zone=ma_flights burst=60 nodelay;
    proxy_pass http://ma_app;
  }
  location = /api/health {
    limit_req zone=ma_health burst=10 nodelay;
    proxy_pass http://ma_app;
  }
  location ~ ^/api/(csp-report|metrics)$ {
    limit_req zone=ma_reports burst=30 nodelay;
    client_max_body_size 16k;
    proxy_pass http://ma_app;
  }
  location /api/ {
    limit_req zone=ma_api burst=60 nodelay;
    proxy_pass http://ma_app;
  }
  # Pages rendered per request: flight detail, the board feed, journey content.
  location ~ ^/(en|ms)/([a-z]{3}/flights/[^/]+|journey/content/[^/]+)/?$ {
    limit_req zone=ma_dynamic burst=60 nodelay;
    proxy_pass http://ma_app;
  }
  # Everything else is prerendered: serve it without a limit (never make guidance disappear).
  location / {
    proxy_pass http://ma_app;
  }
  # Streaming concierge answers and the board feed must not be buffered.
  proxy_buffering off;
}
